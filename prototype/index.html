<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Sixfold Isle: an island trading game for 2 to 4 players. Host a room, share the code, play in your browsers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Cpolygon points='0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5' fill='%23e9b94a' stroke='%230a1b23' stroke-width='1.5'/%3E%3Cpolygon points='0,-11 9.5,-5.5 0,0' fill='%232f7a4b'/%3E%3Cpolygon points='9.5,-5.5 9.5,5.5 0,0' fill='%23c0623a'/%3E%3Cpolygon points='0,11 -9.5,5.5 0,0' fill='%2395c94e'/%3E%3Cpolygon points='-9.5,5.5 -9.5,-5.5 0,0' fill='%237e8a99'/%3E%3C/svg%3E">
<title>Sixfold Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
:root {
  /* Layout: board-first table. The island fills the left column with the dock (prompt, hand, actions) under it;
     a ledger rail on the right holds players and the log. Stacks to one column on phones. */
  --abyss: #0a1b23;
  --deep: #0e2732;
  --tide: #12404f;
  --swell: #1b5767;
  --panel: #0f2630;
  --panel-2: #15323e;
  --panel-3: #1b3d4a;
  --line: rgba(190, 222, 224, 0.13);
  --line-2: rgba(190, 222, 224, 0.26);
  --ink: #eef3ef;
  --ink-2: #a9bec1;
  --ink-3: #7a9298;
  --lantern: #f4b740;
  --lantern-2: #ffd27a;
  --on-lantern: #2b1c00;
  --alarm: #ff8a75;
  --go: #63d69a;
  --wood: #2f7a4b;
  --brick: #c0623a;
  --sheep: #95c94e;
  --wheat: #e9b94a;
  --ore: #7e8a99;
  --desert: #d7c69c;
  --ivory: #f4ecd6;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1100px 700px at 28% 18%, #113241 0%, var(--abyss) 62%) fixed, var(--abyss);
  color: var(--ink);
  font: 14px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lantern-2); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  grid-template-areas: "top top" "main tray" "main side";
  grid-template-rows: auto auto 1fr;
  column-gap: 20px;
  row-gap: 12px;
  padding-inline: 16px;
  padding-block: 0 20px;
  max-width: 1500px;
  margin: 0 auto;
}
@media (min-width: 1180px) {
  .app { grid-template-columns: 272px minmax(0, 1fr) 344px; grid-template-areas: "top top top" "side main tray"; grid-template-rows: auto 1fr; }
}
@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "tray" "side"; grid-template-rows: none; }
}

/* ---------- Top bar ---------- */
.top {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 14px;
  padding-block: 12px;
  min-width: 0;
}
.brand {
  font: 400 23px/1 var(--display);
  letter-spacing: 0.01em;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 9px;
}
.brand svg { width: 22px; height: 22px; flex: none; }
.turnchip {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 5px 11px 5px 7px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden;
}
.turnchip .label { overflow: hidden; text-overflow: ellipsis; }
.turnchip .sub { color: var(--ink-2); font-weight: 500; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.35); }
.spacer { flex: 1; }
.dice { display: flex; gap: 6px; }
.die { width: 30px; height: 30px; display: block; }
.dice.rolling .die { animation: tumble 0.6s cubic-bezier(.2, .8, .3, 1.2); }
.dice.rolling .die + .die { animation-delay: 0.06s; }
@keyframes tumble {
  0% { transform: rotate(-200deg) scale(0.6); opacity: 0.2; }
  70% { transform: rotate(14deg) scale(1.08); opacity: 1; }
  100% { transform: rotate(0) scale(1); }
}
.iconbtn {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--line); flex: none;
}
.iconbtn:hover { border-color: var(--line-2); }
.iconbtn svg { width: 18px; height: 18px; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync.live { background: var(--go); }
.sync.busy { background: var(--lantern); animation: blink 0.9s ease-in-out infinite; }
.sync.off { background: var(--alarm); }
@keyframes blink { 50% { opacity: 0.3; } }
@media (max-width: 560px) {
  .brand span { display: none; }
  .top { gap: 10px; }
  .die { width: 26px; height: 26px; }
}

/* ---------- Main column ---------- */
.main { grid-area: main; display: flex; flex-direction: column; gap: 12px; min-width: 0; align-self: start; }
.board-wrap { position: relative; display: flex; justify-content: center; min-width: 0; }
#board {
  width: 100%;
  height: auto;
  max-height: max(380px, calc(100vh - 175px));
  display: block;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
@media (max-width: 920px) { #board { max-height: none; } }
.board-wrap.carded { min-height: 300px; align-items: center; }
.board-wrap.carded #board { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; opacity: 0.35; pointer-events: none; }
.board-wrap.carded .overlay { position: relative; inset: auto; width: 100%; padding: 24px 0; }
#board text { font-family: var(--display); }
#board .hit { fill: transparent; stroke: transparent; cursor: pointer; }
#board .target { cursor: pointer; }
#board .spot { fill: rgba(255, 246, 220, 0.85); stroke: #0b1418; stroke-width: 2.5; pointer-events: none; animation: pulse 1.3s ease-in-out infinite; }
#board .ring { fill: none; stroke: #fff6dc; stroke-width: 2; opacity: 0.6; pointer-events: none; }
#board .target:hover .spot { fill: rgba(255, 210, 122, 0.75); animation: none; }
#board .espot { stroke: #fff6dc; stroke-width: 6; stroke-linecap: round; opacity: 0.9; pointer-events: none; animation: pulse 1.3s ease-in-out infinite; }
#board .eback { stroke: #0b1418; stroke-width: 10; stroke-linecap: round; opacity: 0.45; pointer-events: none; }
#board .target:hover .espot { stroke: var(--lantern-2); stroke-width: 8; opacity: 1; animation: none; }
#board .hexglow { fill: rgba(255, 246, 220, 0.12); stroke: #fff6dc; stroke-width: 3; stroke-dasharray: 6 5; pointer-events: none; animation: pulse 1.3s ease-in-out infinite; }
#board .target:hover .hexglow { fill: rgba(255, 210, 122, 0.3); animation: none; }
#board .ghost { opacity: 0.7; pointer-events: none; }
#board .pending { opacity: 0.55; pointer-events: none; animation: blink 0.9s ease-in-out infinite; }
.dice.spinning .die { animation: spin 0.45s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#board .piece { pointer-events: none; }
#board .fresh { animation: pop 0.45s cubic-bezier(.2, .9, .3, 1.4); transform-box: fill-box; transform-origin: center; }
#board .hotring { fill: none; stroke: #fff6dc; stroke-width: 3.5; pointer-events: none; animation: pulse 1.6s ease-in-out 3; }
@keyframes pulse { 50% { opacity: 0.4; } }
@keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* Lobby / game-over card over the board */
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 12px;
  pointer-events: none;
}
@media (max-width: 560px) { .board-wrap.carded .overlay { padding: 8px 0; } }
.overlay > .card { pointer-events: auto; }
.card {
  background: rgba(15, 38, 48, 0.94);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 20px;
  width: min(440px, 100%);
  box-sizing: border-box;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(6px);
}
.card h2 { font: 400 24px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance; }
.card .lede { color: var(--ink-2); margin: 0 0 16px; }
.seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.seat {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 9px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
}
.seat.open { color: var(--ink-3); border-style: dashed; background: transparent; }
.seat .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.seat .you { color: var(--ink-3); font-weight: 500; }
.online { width: 7px; height: 7px; border-radius: 50%; background: var(--go); flex: none; margin-left: auto; }
.online.away { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.text {
  background: var(--abyss); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; width: 100%;
  box-sizing: border-box; min-width: 0;
}
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.3);
}
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--abyss); }
.swatch:disabled { opacity: 0.18; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--ink-3); font-size: 12.5px; margin: 14px 0 0; }
.hint b { color: var(--ink-2); }

/* ---------- Buttons ---------- */
.btn {
  font-weight: 650; font-size: 14px; line-height: 1;
  padding: 11px 15px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--panel-3); }
.btn.primary { background: var(--lantern); color: var(--on-lantern); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--lantern-2); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--alarm); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.on, .btn.on:hover:not(:disabled) { background: var(--ivory); color: var(--abyss); border-color: transparent; }

/* ---------- Dock ---------- */
.prompt {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px; border-radius: 14px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.prompt.mine { border-color: rgba(244, 183, 64, 0.55); background: linear-gradient(0deg, rgba(244, 183, 64, 0.07), rgba(244, 183, 64, 0.07)), var(--panel-2); }
.prompt .msg { flex: 1 1 220px; min-width: 0; }
.prompt .msg strong { display: block; font-size: 15.5px; font-weight: 700; }
.prompt .msg span { color: var(--ink-2); font-size: 13px; }
.prompt .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.dock { grid-area: tray; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-self: start; container-type: inline-size; min-width: 0; }
.dock:empty { display: none; }
.tray {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 18px; align-items: start;
  padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
}
@container (max-width: 600px) { .tray { grid-template-columns: minmax(0, 1fr); } }
.traytitle { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: -4px; }
.hand { display: flex; gap: 8px; flex-wrap: wrap; }
.rcard {
  --c: var(--ore);
  width: 52px; height: 70px; border-radius: 9px; background: var(--c);
  display: grid; place-items: center; position: relative; flex: none;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.16), 0 2px 0 rgba(0, 0, 0, 0.35);
}
.rcard svg { width: 32px; height: 32px; }
.rcard .n {
  position: absolute; bottom: -7px; right: -7px; min-width: 24px; height: 24px; padding: 0 5px; box-sizing: border-box;
  border-radius: 12px; background: var(--ink); color: var(--abyss);
  font: 750 13px/24px var(--ui); text-align: center; font-variant-numeric: tabular-nums;
}
.rcard.zero { opacity: 0.32; }
.rcard.zero .n { background: var(--panel-3); color: var(--ink-2); }
.handmeta { color: var(--ink-3); font-size: 12px; margin-top: 10px; }
.build { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.bbtn { flex-direction: column; align-items: flex-start; gap: 7px; padding: 9px 11px; }
.bbtn .cost { display: flex; gap: 3px; }
.cost i { display: block; width: 9px; height: 13px; border-radius: 2px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
.devrow { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; }
.devcard {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--line); min-width: 0;
}
.devcard .t { font-weight: 650; }
.devcard .c { color: var(--ink-3); font-size: 12px; }
.devcard.vp { border-style: dashed; }

/* Offers */
.offers { display: grid; gap: 8px; }
.offer {
  display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line-2);
}
.offer .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.offer .who { font-weight: 700; }
.offer .resp { color: var(--ink-2); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }
.ok { color: var(--go); }
.no { color: var(--alarm); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip {
  --c: var(--ore);
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border-radius: 7px;
  background: color-mix(in srgb, var(--c) 30%, var(--panel-2)); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  font-size: 12.5px; font-weight: 650; white-space: nowrap;
}
.chip svg { width: 16px; height: 16px; border-radius: 4px; background: var(--c); padding: 1px; box-sizing: border-box; }

/* ---------- Side rail ---------- */
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; align-self: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.box > .eyebrow { display: block; margin: 2px 4px 8px; }
.players { display: grid; gap: 4px; }
.player {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  padding: 9px 10px; border-radius: 10px;
}
.player.turn { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.player .pc { grid-column: 1; grid-row: 1 / span 2; display: grid; place-items: center; }
.player .pc svg { width: 30px; height: 30px; display: block; }
.player .nm { grid-column: 2; grid-row: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; min-width: 0; }
.player .nm span { overflow: hidden; text-overflow: ellipsis; }
.player .nm .you { color: var(--ink-3); font-weight: 500; flex: none; }
.player .vp { grid-column: 3; grid-row: 1 / span 2; text-align: right; font: 400 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.player .vp small { display: block; font: 600 10px/1.3 var(--ui); letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.player .stats { grid-column: 2; grid-row: 2; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 650; }
.badges { grid-column: 2 / -1; grid-row: 3; display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ivory); color: var(--abyss); }
.tag { font-size: 10.5px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--lantern); color: var(--on-lantern); flex: none; }
.tag.wait { background: var(--panel-3); color: var(--ink-2); }

.log {
  max-height: 340px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 5px;
  font-size: 13px; color: var(--ink-2); padding: 0 4px 4px; overscroll-behavior: contain;
}
@media (max-width: 920px) { .log { max-height: 280px; } }
@media (min-width: 1180px) { .log { max-height: max(150px, calc(100vh - 600px)); } }
.log .e { overflow-wrap: anywhere; }
.log .e b { color: var(--ink); font-weight: 650; }
.log .e.chat { color: var(--ink); }
.log .e.big { color: var(--lantern-2); font-weight: 600; }
.log .sep {
  margin-top: 8px; font-size: 10.5px; font-weight: 750; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 8px;
}
.log .sep::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.chatform { display: flex; gap: 8px; margin-top: 10px; }
.chatform .text { padding: 9px 11px; }
.bankline { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 4px; }
.bankline span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Sheets ---------- */
.back {
  position: fixed; inset: 0; z-index: 30; background: rgba(3, 12, 16, 0.62);
  display: grid; place-items: end center; padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 640px) { .back { place-items: center; } }
.sheet {
  width: min(470px, 100%); max-height: min(86vh, 720px); overflow: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; padding: 18px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
}
.sheet h3 { font: 400 21px/1.2 var(--display); margin: 0 0 4px; text-wrap: balance; }
.sheet .sub { color: var(--ink-2); margin: 0 0 14px; }
.sheet .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.tabs { display: flex; gap: 6px; margin: 4px 0 14px; }
.steppers { display: grid; gap: 6px; }
.stepper { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 0; }
.stepper .ic { width: 26px; height: 26px; border-radius: 6px; background: var(--c); display: grid; place-items: center; }
.stepper .ic svg { width: 20px; height: 20px; }
.stepper .lbl { font-weight: 600; }
.stepper .lbl small { color: var(--ink-3); font-weight: 500; margin-left: 6px; }
.ctl { display: flex; align-items: center; gap: 4px; }
.ctl button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel-2); font-size: 18px; line-height: 1; }
.ctl button:disabled { opacity: 0.3; cursor: not-allowed; }
.ctl output { width: 28px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 14px; align-items: center; }
.tgrid .hd { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.tgrid .rl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tgrid .rl .ic { width: 26px; height: 26px; border-radius: 6px; background: var(--c); display: grid; place-items: center; flex: none; }
.tgrid .rl .ic svg { width: 20px; height: 20px; }
.tgrid .rl span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tgrid .rl small { color: var(--ink-3); font-weight: 500; white-space: nowrap; }
@media (max-width: 440px) { .tgrid .rl span { display: none; } .tgrid { gap: 6px 8px; } .ctl button { width: 32px; height: 32px; } .ctl output { width: 22px; } }
.pickgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick {
  display: grid; justify-items: center; gap: 4px; padding: 8px 2px 7px; border-radius: 10px;
  border: 1.5px solid var(--line-2); background: var(--panel-2); font-size: 11.5px; font-weight: 650; min-width: 0;
}
.pick .ic { width: 30px; height: 30px; border-radius: 7px; background: var(--c); display: grid; place-items: center; }
.pick .ic svg { width: 24px; height: 24px; }
.pick small { color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.pick[aria-pressed="true"] { border-color: var(--lantern); background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--lantern); }
.pick:disabled { opacity: 0.3; cursor: not-allowed; }
.sheet .group + .group { margin-top: 14px; }
.costs { display: grid; gap: 8px; margin: 6px 0 14px; }
.costs > div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.rules { color: var(--ink-2); padding-left: 18px; margin: 0; display: grid; gap: 4px; }
.menuitems { display: grid; gap: 8px; }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px));
  z-index: 40; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(420px, calc(100% - 32px));
}
.toast {
  background: var(--ivory); color: var(--abyss); font-weight: 650; padding: 10px 14px; border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); animation: rise 0.25s ease-out; text-align: center;
}
.toast.err { background: #ffd7cf; color: #4a120a; }
@keyframes rise { from { transform: translateY(-10px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Standalone (room code) ---------- */
.roomline {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px; margin-bottom: 16px; border-radius: 12px;
  background: var(--abyss); border: 1px dashed var(--line-2);
}
.roomcode { font: 400 32px/1.05 var(--display); letter-spacing: 0.14em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.roomchip { cursor: pointer; padding: 5px 11px; }
.roomchip .label { letter-spacing: 0.1em; }
.codein { flex: 1 1 120px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; font-size: 18px; width: auto; }
body.noroom .side, body.noroom .dock { display: none; }
@media (max-width: 560px) { #roomchip { display: none; } }

  function reduce(s, pid, a, rng) {
    if (!a || typeof a.type !== 'string') return 'Unknown action';
    if (typeof pid !== 'string' || !pid) return 'Unknown player';
    const p = seatOf(s, pid);

    switch (a.type) {
      case 'chat': {

      }
      case 'sit': {
        if (s.phase !== 'lobby') return 'The game has already started';

        if (s.seats.some((x) => x.color === a.color && x.pid !== pid)) return 'That color is taken';
        const nick = cleanNick(a.nick);
        const mine = s.seats.find((x) => x.pid === pid);
        if (mine) {
          mine.color = a.color;
          mine.nick = nick;
          return null;
        }
        if (s.seats.length >= MAX_SEATS) return 'The table is full';
        s.seats.push({ pid, color: a.color, nick });

      }
      case 'stand': {
        if (s.phase !== 'lobby') return 'The game has already started';

        if (s.phase !== 'lobby') return 'The game has already started';

        resetToLobby(s, seats);

        return null;
      }
      case 'claim': {
        const i = Number(a.seat);
        if (s.phase === 'lobby') {
          const seat = s.seats[i];

        }

        if (p >= 0) return 'You already have a seat';

        s.players[i].pid = pid;
        return null;
      }
      default:
        break;
    }

    if (s.phase === 'lobby') return 'The game has not started yet';
    if (s.phase === 'over') return 'This game is over';
    if (p < 0) return 'You are watching this game';
    const me = s.players[p];
    const myTurn = s.turn === p;

    switch (a.type) {
      case 'setup': {
        if (s.stage !== 'setup') return 'Setup is finished';
        if (!myTurn) return 'Wait for your turn';
        const v = Number(a.v);
        const e = Number(a.e);
        if (!(v >= 0 && v < VERTS.length) || !vertFree(s, v)) return 'Settlements need a free corner with no neighbor next to it';
        if (!VERTS[v].edges.includes(e) || s.edges[e] != null) return 'The road must touch your new settlement';
        s.verts[v] = [p, 1];
        me.pieces.settlement--;
        s.edges[e] = p;
        me.pieces.road--;
        const second = s.setupI >= s.players.length;
        let got = null;
        if (second) {

          for (const h of VERTS[v].hexes) {
            const t = s.board.hexes[h].t;

              got[t] = (got[t] || 0) + 1;
            }
          }
        }

        s.setupI++;
        const order = snakeOrder(s.players.length);
        if (s.setupI >= order.length) {
          s.stage = 'preroll';
          s.turn = 0;
          s.turnN = 1;
          log(s, { k: 'turn', p: 0 });
        } else {
          s.turn = order[s.setupI];
        }
        s.roadLens = s.players.map((_, i) => roadLen(s, i));
        return null;
      }

      case 'roll': {
        if (!myTurn) return 'Wait for your turn';
        if (s.stage !== 'preroll') return 'You already rolled';
        const d1 = 1 + Math.floor(rng() * 6);
        const d2 = 1 + Math.floor(rng() * 6);
        const sum = d1 + d2;
        s.dice = [d1, d2];
        if (sum === 7) {
          const need = {};
          s.players.forEach((pl, i) => {
            const t = total(pl.res);
            if (t > 7) need[i] = Math.floor(t / 2);
          });
          log(s, { k: 'roll', p, d: [d1, d2], seven: true, need });
          s.robberReturn = 'main';
          if (Object.keys(need).length) {
            s.discard = need;
            s.stage = 'discard';
          } else {
            s.stage = 'robber';
          }
        } else {
          const out = produce(s, sum);
          log(s, { k: 'roll', p, d: [d1, d2], g: out.gains, short: out.short });
          s.stage = 'main';
        }
        return null;
      }

      case 'discard': {
        if (s.stage !== 'discard' || !s.discard || s.discard[p] == null) return 'You don’t need to discard';
        const c = cleanCounts(a.cards);
        const n = total(c);
        if (n !== s.discard[p]) return `Choose exactly ${s.discard[p]} cards to discard`;
        if (!has(me.res, c)) return 'You don’t have those cards';
        pay(s, p, c);
        delete s.discard[p];
        log(s, { k: 'discard', p, c });
        if (!Object.keys(s.discard).length) {

      }

      case 'robber': {
        if (!myTurn || s.stage !== 'robber') return 'You can’t move the robber now';
        const h = Number(a.hex);
        if (!(h >= 0 && h < HEXES.length)) return 'Pick a tile';
        if (h === s.board.robber) return 'Move the robber to a different tile';
        const victims = robberVictims(s, p, h);
        let victim = null;
        if (victims.length) {
          victim = victims.length === 1 && a.victim == null ? victims[0] : Number(a.victim);

        }

        s.robberReturn = null;
        return null;
      }

      case 'end': {
        if (!myTurn) return 'Wait for your turn';
        if (s.stage !== 'main') return s.stage === 'preroll' ? 'Roll the dice first' : 'Finish what you’re doing first';

        s.turn = (s.turn + 1) % s.players.length;
        s.stage = 'preroll';
        s.turnN = (s.turnN || 0) + 1;
        log(s, { k: 'turn', p: s.turn });
        checkWin(s);
        return null;
      }

      case 'build': {
        if (!myTurn) return 'Wait for your turn';
        if (s.stage !== 'main') return s.stage === 'preroll' ? 'Roll the dice first' : 'Finish what you’re doing first';
        const what = a.what;
        if (what === 'road') {
          const e = Number(a.e);
          if (!has(me.res, COST.road)) return 'A road costs 1 wood and 1 brick';
          if (me.pieces.road <= 0) return 'You have no roads left';
          if (!roadOK(s, p, e)) return 'Roads must connect to your own roads or buildings';

          s.edges[e] = p;
          me.pieces.road--;
          log(s, { k: 'build', p, w: 'road', at: e });
          updateLongest(s);
          checkWin(s);
          return null;

        if (what === 'settlement') {
          const v = Number(a.v);
          if (!has(me.res, COST.settlement)) return 'A settlement costs wood, brick, sheep and wheat';
          if (me.pieces.settlement <= 0) return 'You have no settlements left — upgrade one to a city';
          if (!settlementOK(s, p, v)) return 'Settlements need your road and no neighbor next door';
          pay(s, p, COST.settlement);
          s.verts[v] = [p, 1];
          me.pieces.settlement--;
          log(s, { k: 'build', p, w: 'settlement', at: v });
          updateLongest(s);
          checkWin(s);
          return null;
        }
        if (what === 'city') {
          const v = Number(a.v);
          if (!has(me.res, COST.city)) return 'A city costs 2 wheat and 3 ore';
          if (me.pieces.city <= 0) return 'You have no cities left';
          const b = s.verts[v];
          if (!b || b[0] !== p || b[1] !== 1) return 'Cities replace one of your settlements';
          pay(s, p, COST.city);
          s.verts[v] = [p, 2];
          me.pieces.city--;
          me.pieces.settlement++;
          log(s, { k: 'build', p, w: 'city', at: v });

          return null;
        }

          if (!left) return 'The development deck is empty';
          pay(s, p, COST.dev);
          let x = Math.floor(rng() * left);
          let card = DEV_TYPES[0];
          for (const k of DEV_TYPES) {
            if (x < s.deck[k]) { card = k; break; }
            x -= s.deck[k];
          }
          s.deck[card]--;
          if (card === 'vp') me.vpCards++;
          else me.fresh[card]++;
          log(s, { k: 'buy', p, c: card });
          checkWin(s);
          return null;
        }
        return 'Unknown build';
      }

      case 'play': {
        if (!myTurn) return 'Wait for your turn';
        if (s.stage !== 'preroll' && s.stage !== 'main') return 'You can’t play a card right now';

          me.knights++;
          s.devPlayed = true;
          log(s, { k: 'play', p, c });

          s.robberReturn = s.stage;
          s.stage = 'robber';
          checkWin(s);
          return null;

          s.devPlayed = true;
          s.freeRoads = n;

          for (const r of picks) need[r] = (need[r] || 0) + 1;
          if (!RES.every((r) => s.bank[r] >= (need[r] || 0))) return 'The bank doesn’t have those';
          me.dev.plenty--;
          s.devPlayed = true;
          for (const r of picks) gain(s, p, r, 1);
          log(s, { k: 'play', p, c, picks });
          return null;
        }

          const r = a.r;
          if (!RES.includes(r)) return 'Pick a resource';
          me.dev.mono--;
          s.devPlayed = true;
          let n = 0;
          const from = {};
          s.players.forEach((pl, i) => {
            if (i === p || !pl.res[r]) return;
            from[i] = pl.res[r];
            n += pl.res[r];
            me.res[r] += pl.res[r];
            pl.res[r] = 0;
          });
          log(s, { k: 'play', p, c, r, n, from });
          return null;
        }
        return 'Unknown card';
      }

      case 'free_road': {
        if (!myTurn || s.stage !== 'roads') return 'You have no free roads to place';
        const e = Number(a.e);
        if (me.pieces.road <= 0) return 'You have no roads left';
        if (!roadOK(s, p, e)) return 'Roads must connect to your own roads or buildings';
        s.edges[e] = p;
        me.pieces.road--;
        s.freeRoads--;
        log(s, { k: 'build', p, w: 'road', at: e, free: true });
        updateLongest(s);
        if (s.freeRoads <= 0 || me.pieces.road <= 0 || !legalRoads(s, p).length) {
          s.stage = s.roadsReturn || 'main';
          s.freeRoads = 0;
          s.roadsReturn = null;
        }
        checkWin(s);
        return null;
      }

      case 'skip_roads': {
        if (!myTurn || s.stage !== 'roads') return 'You have no free roads to place';
        s.stage = s.roadsReturn || 'main';
        s.freeRoads = 0;
        s.roadsReturn = null;
        return null;
      }

      case 'bank': {
        if (!myTurn) return 'Trade with the bank on your own turn';
        if (s.stage !== 'main') return s.stage === 'preroll' ? 'Roll the dice first' : 'Finish what you’re doing first';
        const g = a.give;
        const t = a.get;
        if (!RES.includes(g) || !RES.includes(t) || g === t) return 'Pick two different resources';
        const rate = rateFor(s, p, g);
        if (me.res[g] < rate) return `You need ${rate} ${g} for this trade`;
        if (s.bank[t] < 1) return `The bank is out of ${t}`;
        me.res[g] -= rate;
        s.bank[g] += rate;
        gain(s, p, t, 1);
        log(s, { k: 'bank', p, g, n: rate, t });
        return null;
      }

      case 'offer': {
        if (s.stage !== 'main') return 'Trading opens after the roll';
        const give = cleanCounts(a.give);
        const want = cleanCounts(a.want);
        if (!total(give) || !total(want)) return 'Choose what you give and what you want';
        if (RES.some((r) => give[r] && want[r])) return 'You can’t give and ask for the same resource';
        if (!has(me.res, give)) return 'You don’t have those cards';
        s.offers = (s.offers || []).filter((o) => o.from !== p);
        s.offerN = (s.offerN || 0) + 1;
        s.offers.push({ id: s.offerN, from: p, give, want, resp: {} });
        return null;
      }

      case 'respond': {
        const o = (s.offers || []).find((x) => x.id === Number(a.id));
        if (!o) return 'That offer is gone';
        if (o.from === p) return 'That’s your own offer';
        if (o.from === s.turn) {
          if (a.yes) {
            if (!has(me.res, o.want)) return 'You don’t have what they asked for';
            o.resp[p] = 1;
          } else {
            o.resp[p] = 0;
          }
          return null;
        }
        if (!myTurn) return 'Only the player whose turn it is can take this offer';
        if (!a.yes) {
          o.resp[p] = 0;
          return null;
        }
        if (!has(s.players[o.from].res, o.give)) return 'They no longer have the cards they offered';
        if (!has(me.res, o.want)) return 'You don’t have the cards they asked for';
        const err = doTrade(s, o.from, p, o.give, o.want);
        if (err) return err;
        s.offers = s.offers.filter((x) => x.id !== o.id);
        return null;
      }

      case 'confirm': {
        const o = (s.offers || []).find((x) => x.id === Number(a.id));
        if (!o) return 'That offer is gone';
        if (o.from !== p || !myTurn) return 'Only the player who made the offer can confirm it';
        const w = Number(a.with);
        if (!o.resp || o.resp[w] !== 1) return 'They haven’t accepted this offer';
        if (!has(me.res, o.give)) return 'You no longer have the cards you offered. Withdraw it or make a new offer.';
        if (!s.players[w] || !has(s.players[w].res, o.want)) return 'They no longer have the cards you asked for';
        const err = doTrade(s, p, w, o.give, o.want);
        if (err) return err;
        s.offers = s.offers.filter((x) => x.id !== o.id);
        return null;
      }

      case 'cancel': {
        const o = (s.offers || []).find((x) => x.id === Number(a.id));
        if (!o) return null;
        if (o.from !== p) return 'You can only withdraw your own offer';
        s.offers = s.offers.filter((x) => x.id !== o.id);
        return null;
      }

      default:
        return 'Unknown action';
    }
  }

  /** Apply one action. Never mutates s0. Returns {ok, state} or {ok:false, err}. */
  function apply(s0, pid, action, rng) {

    let err;

    if (s.log.length > LOG_MAX) s.log = s.log.slice(s.log.length - LOG_MAX);
    return { ok: true, state: s };
  }

  const Engine = {
    RES, COST, DEV_PLAY, DEV_TYPES, DEV_COUNTS, PIECES, BANK_EACH, WIN_VP, MAX_SEATS, COLORS,
    HEXES, VERTS, EDGES, HEX_V, HEX_NB, COAST, PORT_SLOTS,

  /* =====================================================================
     Sync: db holds the table; writers commit directly under a short lease.
     Viewers who can't write put their move in room presence; a writer's
     page applies it and records an ack.
     ===================================================================== */
  function parseSnap(snap) {
    if (!snap || !snap.exists) return null;
    const d = snap.data();
    if (!d || typeof d.s !== 'string') return null;
    try {
      const st = JSON.parse(d.s);
      return st && typeof st === 'object' && st.phase ? st : null;
    } catch (e) {
      return null;
    }

  let chain = Promise.resolve();
  function enqueue(job) {
    const p = chain.then(job, job);
    chain = p.catch(() => {});

  /* Take the short write lease and read the table in parallel. A granted lease means the previous
     holder's write finished at least a second ago, so the read that raced it is current. */
  async function lockAndRead(ref, useLease) {
    const canLease = useLease && !Net.leaseBroken && typeof ref.acquire === 'function';
    let errors = 0;
    for (let i = 0; i < 16; i++) {
      const lockP = canLease
        ? ref.acquire({ holder: TAB_ID, ttlMs: 5000 }).then((r) => r || {}, () => ({ failed: true }))
        : Promise.resolve({ none: true });
      const [lk, snap] = await Promise.all([lockP, ref.get()]);
      if (lk.failed) {
        errors++;
        if (errors >= 3) {
          Net.leaseBroken = true;
          return { held: 'none', snap };
        }
        await sleep(150 + rng() * 200);
        continue;
      }
      if (lk.none) return { held: 'none', snap };
      if (lk.acquired) return { held: 'held', snap };
      const left = lk.expiresAt ? Date.parse(lk.expiresAt) - Date.now() : 400;
      await sleep(Math.max(60, Math.min(1500, isFinite(left) ? left : 400)) + rng() * 160);
    }
    return { held: 'none', snap: await ref.get() };
  }

  async function directCommit(pid, action, relayN) {
    const ref = Net.db.doc(DOC_PATH);
    let held;
    let snap;
    try {
      // Unknown write access: skip the lease so a refused write never holds it.
      const got = await lockAndRead(ref, Net.writer !== null);
      held = got.held;
      snap = got.snap;
    } catch (e) {
      return { ok: false, err: 'Couldn’t reach the table. Check your connection and try again.' };
    }
    const cur = parseSnap(snap) || Object.assign(E.newTable(), { seq: S ? S.seq : 0 });
    if (relayN != null && ((cur.acks || {})[pid] || 0) >= relayN) {
      adopt(cur);
      return { ok: true, dup: true };
    }
    const r = E.apply(cur, pid, action, rng);
    let next;
    if (!r.ok) {
      if (relayN == null) {
        adopt(cur);
        return r;
      }
      next = E.clone(cur);
      next.seq = (cur.seq || 0) + 1;
      next.errs = next.errs || {};
      next.errs[pid] = { n: relayN, m: r.err };
    } else {

      try {
        await ref.set(body);
        break;
      } catch (e) {
        const code = e && e.code;

        if (code === 'unavailable' && attempt === 0) {

    }

      Net.writer = true;
    }
    announce({ seq: next.seq });
    adopt(next);
    return r.ok ? { ok: true } : { ok: true, relayedErr: r.err };
  }

  const Relay = { queue: [], out: null, lastN: 0, timer: null };

      const o = Relay.out;

      Relay.out = null;
      Net.room.presence({ act: null }).catch(() => {});
      o.item.resolve({ ok: false, err: 'Nobody who can save moves has the game open. Ask the host to open it, or to invite you as an Editor.' });

  /* =====================================================================
     Standalone multiplayer. One browser hosts the table and runs the rules.
     Every message travels through two free public MQTT brokers at once (secure
     WebSockets), so computers never need a direct connection to each other.
     Messages are encrypted with a key derived from the room code, and topics
     are hashed so the code itself never appears on the broker.
     The host saves the game in its browser, so a reload picks up where it was.
     ===================================================================== */
  const P2P = (function () {
    const BROKERS = window.__SIXFOLD_BROKERS || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
    const ALPHABET = 'ACDEFGHJKMNPQRTUVWXY34679';
    const PID_RE = /^local-[a-z0-9]{4,24}$/;
    const PING_MS = 3000;
    const ALIVE_MS = 12000;
    const st = {
      role: null, code: null, status: 'idle', note: '', n: 0, waits: new Map(), online: null,
      needFull: true, clients: [], base: '', key: null, gen: 0, timers: [], startedAt: 0,
      seen: new Map(), lastBeat: 0, lastBeatSent: 0, lastAsk: 0,
      outChain: Promise.resolve(), inChain: Promise.resolve(),
    };

    function newCode() {
      let c = '';
      for (let i = 0; i < 4; i++) c += ALPHABET[Math.floor(rng() * ALPHABET.length)];
      return c;
    }
    function clean(code) {
      return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    }
    function canLink() { return /^https?:$/.test(location.protocol); }
    function link() {
      try {
        const u = new URL(location.href);
        u.hash = '';
        u.search = '?room=' + st.code;
        return u.toString();
      } catch (e) {
        return '';
      }
    }
    function setURL(code) {
      try { history.replaceState(null, '', code ? '?room=' + code : location.pathname); } catch (e) { /* file:// */ }
    }
    function save() {
      if (st.role === 'host' && S) store('sixfold.game.' + st.code, JSON.stringify(S));
    }
    function load(code) {
      try {
        const s = JSON.parse(store('sixfold.game.' + code) || 'null');
        return s && s.phase ? s : null;
      } catch (e) {
        return null;
      }
    }
    function lastHosted() {
      const c = clean(store('sixfold.lastHosted') || '');
      const s = c && load(c);
      return s && s.phase !== 'over' ? c : '';
    }
    const linkUp = () => st.clients.some((c) => c.connected);

    /* ---- encryption + encoding ---- */
    function hex(buf) {
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    function b64(u8) {
      let s = '';
      for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return btoa(s);
    }

      const s = atob(str);
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    }
    async function derive(code) {
      const enc = new TextEncoder();
      const t = await crypto.subtle.digest('SHA-256', enc.encode('sixfold-isle/v1/topic/' + code));
      const k = await crypto.subtle.digest('SHA-256', enc.encode('sixfold-isle/v1/key/' + code));
      const key = await crypto.subtle.importKey('raw', k, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      return { base: 'sixfold-isle/v1/' + hex(t).slice(0, 32), key };
    }
    async function seal(obj) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, st.key, new TextEncoder().encode(JSON.stringify(obj))));
      const out = new Uint8Array(12 + ct.length);
      out.set(iv, 0);
      out.set(ct, 12);
      return b64(out);
    }

      const u = unb64(text);
      if (u.length < 13) return null;
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, st.key, u.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    }

    /* ---- broker links ---- */
    function publish(sub, obj, qos) {
      const gen = st.gen;
      st.outChain = st.outChain.then(async () => {
        if (gen !== st.gen || !st.key) return;
        const payload = await seal(obj);
        for (const c of st.clients) {
          if (!c.connected) continue;
          try { c.publish(st.base + sub, payload, { qos: qos || 0, retain: false }); } catch (e) { /* link dropped */ }
        }
      }).catch(() => {});
    }
    function onMessage(gen, topic, payload) {
      st.inChain = st.inChain.then(async () => {
        if (gen !== st.gen || !st.base || topic.indexOf(st.base + '/') !== 0) return;
        const text = typeof payload === 'string' ? payload : new TextDecoder().decode(payload);
        if (!text) return;
        let msg;
        try { msg = await unseal(text); } catch (e) { return; }
        if (gen !== st.gen || !msg || typeof msg !== 'object') return;
        const sub = topic.slice(st.base.length);
        if (st.role === 'host') fromGuest(sub, msg);
        else if (st.role === 'guest') fromHost(sub, msg);
      }).catch(() => {});
    }
    function fail(note) {
      st.status = 'error';
      st.note = note;
      render();
    }
    async function connect() {
      const gen = st.gen;
      if (typeof mqtt === 'undefined' || typeof mqtt.connect !== 'function') return fail('The connection library didn’t load. Check your internet connection and reload the page.');
      if (!window.crypto || !crypto.subtle) return fail('This browser can’t open a secure room here. Open the game from its https:// link.');
      let d;
      try { d = await derive(st.code); } catch (e) { return fail('This browser couldn’t set up the room. Try a current Chrome, Edge, Firefox or Safari.'); }
      if (gen !== st.gen) return;
      st.base = d.base;
      st.key = d.key;
      const subs = st.role === 'host' ? [st.base + '/up'] : [st.base + '/state', st.base + '/beat', st.base + '/ack/' + Net.pid];
      st.clients = BROKERS.map((url) => {
        const c = mqtt.connect(url, {
          clientId: 'sxi_' + Math.floor(rng() * 1e15).toString(36),
          clean: true, keepalive: 45, reconnectPeriod: 2500, connectTimeout: 10000, queueQoSZero: false,
        });
        c.on('connect', () => {
          if (gen !== st.gen) return;
          c.subscribe(subs, { qos: 1 });
          onLinkUp();
        });
        c.on('message', (topic, payload) => onMessage(gen, topic, payload));
        const down = () => { if (gen === st.gen && evaluate()) render(); };
        c.on('close', down);
        c.on('offline', down);
        c.on('error', () => {});
        return c;
      });
    }
    function onLinkUp() {
      if (st.role === 'host') {
        evaluate();
        publishState();
        beat(true);
      } else {
        publish('/up', { t: 'hello', pid: Net.pid });
        evaluate();
      }
      render();
    }
    function stop() {
      st.gen++;
      for (const t of st.timers) clearInterval(t);
      st.timers = [];
      for (const w of st.waits.values()) {
        clearTimeout(w.timer);
        w.resolve({ ok: false, err: 'You left the room.' });
      }
      st.waits.clear();
      const old = st.clients;
      st.clients = [];
      setTimeout(() => {
        for (const c of old) {
          try { c.end(true); } catch (e) { /* ignore */ }
        }
      }, 400);
      st.seen.clear();
      st.lastBeat = 0;
      st.lastBeatSent = 0;
      st.lastAsk = 0;
      st.key = null;
      st.base = '';
    }
    function evaluate() {
      const prev = st.status + '|' + st.note;
      const up = linkUp();
      const slow = Date.now() - st.startedAt > 9000;
      if (st.status === 'error') return false;
      if (st.role === 'host') {
        st.status = up ? 'hosting' : 'starting';
        st.note = up ? '' : slow ? 'Can’t reach the game servers. Retrying…' : '';
      } else if (st.role === 'guest') {
        const wasConnected = st.status === 'connected';
        const alive = Date.now() - st.lastBeat < ALIVE_MS;
        if (!up) {
          st.status = 'connecting';
          st.note = slow ? 'Can’t reach the game servers. Retrying…' : '';
        } else if (alive) {
          st.status = 'connected';
          st.note = '';
        } else {
          st.status = Date.now() - st.startedAt > 6000 ? 'waiting' : 'connecting';
          st.note = '';
        }
        if (!wasConnected && st.status === 'connected') onHostBack();
      }
      refreshOnline();
      return prev !== st.status + '|' + st.note;
    }
    function refreshOnline() {
      Net.online = new Set(st.role === 'host' ? onlineList() : st.online || [Net.pid]);
      Net.hostOnline = st.role === 'host' || st.status === 'connected';
    }

    /* ---------------- host ---------------- */
    function onlineList() {
      const list = [Net.pid];
      const now = Date.now();
      for (const [pid, t] of st.seen) if (now - t < ALIVE_MS) list.push(pid);
      return list;
    }
    function publishState() {
      if (st.role === 'host' && S) publish('/state', { s: S, online: onlineList() }, 1);
    }
    function beat(force) {
      if (st.role !== 'host' || !S) return;
      const now = Date.now();
      if (!force && now - st.lastBeatSent < 2000) return;
      st.lastBeatSent = now;
      publish('/beat', { online: onlineList(), seq: S.seq });
    }
    function host(code) {
      stop();
      st.role = 'host';
      st.code = clean(code) || newCode();
      st.status = 'starting';
      st.note = '';
      st.startedAt = Date.now();
      store('sixfold.hostCode', st.code);
      store('sixfold.lastHosted', st.code);
      setURL(st.code);
      S = null;
      UI.logReady = false;
      adopt(load(st.code) || E.newTable(), { force: true });
      Net.phase = 'live';
      refreshOnline();
      connect();
      st.timers.push(setInterval(() => {
        beat(false);
        if (evaluate()) render();
      }, PING_MS));
      render();
    }
    function fromGuest(sub, msg) {
      if (sub !== '/up' || !S || typeof msg.pid !== 'string' || !PID_RE.test(msg.pid) || msg.pid === Net.pid) return;
      const pid = msg.pid;
      const isNew = !st.seen.has(pid) || Date.now() - st.seen.get(pid) >= ALIVE_MS;
      st.seen.set(pid, Date.now());
      if (msg.t === 'hello' || (msg.t === 'ping' && isNew)) {
        publishState();
        beat(true);
        refreshOnline();
        render();
        return;
      }
      if (msg.t === 'ping') {
        beat(false);
        return;
      }
      if (msg.t === 'act' && Number.isFinite(msg.n) && msg.a && typeof msg.a === 'object') {
        const done = (S.acks && S.acks[pid]) || 0;
        if (msg.n <= done) {
          publish('/ack/' + pid, { n: msg.n, ok: true, seq: S.seq }, 1);
          return;
        }
        const r = E.apply(S, pid, msg.a, rng);
        if (r.ok) {
          r.state.acks = Object.assign({}, r.state.acks, { [pid]: msg.n });
          commit(r.state);
        }
        publish('/ack/' + pid, { n: msg.n, ok: r.ok, err: r.ok ? undefined : r.err, seq: S.seq }, 1);
        if (isNew) {
          refreshOnline();
          render();
        }
      }
    }
    function commit(next) {
      adopt(next, { force: true });
      save();
      publishState();
    }
    function submitHost(action) {
      if (!S) return Promise.resolve({ ok: false, err: 'The table isn’t ready yet.' });
      const r = E.apply(S, Net.pid, action, rng);
      if (r.ok) commit(r.state);
      return Promise.resolve(r.ok ? { ok: true } : r);
    }

    /* ---------------- guest ---------------- */
    function join(code) {
      stop();
      st.role = 'guest';
      st.code = clean(code);
      st.status = 'connecting';
      st.note = '';
      st.online = null;
      st.needFull = true;
      st.startedAt = Date.now();
      setURL(st.code);
      S = null;
      UI.logReady = false;
      Net.phase = 'connecting';
      refreshOnline();
      connect();
      st.timers.push(setInterval(() => {
        if (linkUp()) publish('/up', { t: 'ping', pid: Net.pid });
      }, PING_MS));
      st.timers.push(setInterval(() => { if (evaluate()) render(); }, 2000));
      render();
    }
    function alive() {
      st.lastBeat = Date.now();
      if (evaluate()) render();
    }
    function askForState(force) {
      const now = Date.now();
      if (!force && now - st.lastAsk < 1500) return;
      st.lastAsk = now;
      publish('/up', { t: 'hello', pid: Net.pid });
    }
    function onHostBack() {
      if (!S) askForState(true);
      for (const w of st.waits.values()) publish('/up', { t: 'act', pid: Net.pid, n: w.n, a: w.a }, 1);
    }
    function applyState(msg) {
      if (Array.isArray(msg.online)) st.online = msg.online;
      const force = st.needFull;
      st.needFull = false;
      Net.phase = 'live';
      refreshOnline();
      adopt(msg.s, { force });
      render();
    }
    function fromHost(sub, msg) {
      if (sub === '/state') {
        if (!msg.s || typeof msg.s !== 'object' || !msg.s.phase) return;
        alive();
        applyState(msg);
        return;
      }
      if (sub === '/beat') {
        alive();
        if (Array.isArray(msg.online)) st.online = msg.online;
        if (typeof msg.seq === 'number') {
          if (!S || msg.seq > S.seq) askForState(false);
          else if (msg.seq < S.seq) {

            st.needFull = true;
            askForState(false);
          }

        render();
        return;
      }
      if (sub === '/ack/' + Net.pid) {
        alive();

        if (!w) return;
        clearTimeout(w.timer);

    function submitGuest(action) {
      return new Promise((resolve) => {
        const n = Math.max(st.n, (S && S.acks && S.acks[Net.pid]) || 0) + 1;
        st.n = n;
        const w = { n, a: action, resolve, timer: 0 };
        w.timer = setTimeout(() => {
          if (st.waits.get(n) !== w) return;
          st.waits.delete(n);
          resolve({ ok: false, err: 'The host’s game didn’t answer. Check that their tab is still open.' });
