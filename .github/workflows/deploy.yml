name: Deploy
# Ships to the server once the full check has passed on this exact commit. Start it from the Actions
# tab ("Run workflow"), or by pushing to main.
#
# CI (ci.yml) already runs the full check on every push, so Deploy doesn't run it a second time: it
# waits for CI's run on the same commit and deploys only if that passed. A commit with no CI run
# (none was pushed for it) gets the full check here instead. Either way nothing ships unchecked.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Waiting for CI, or running the check here, takes about an hour on GitHub's runners.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Wait for CI's full check on this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha='${{ github.sha }}'
          for i in $(seq 1 240); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"')
            # A push's CI run can take a moment to appear.
            if [ -z "$run" ] && [ "$i" -le 4 ]; then sleep 30; continue; fi
            if [ -z "$run" ]; then
              echo "No CI run for $sha: running the full check here."
              echo "found=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            read -r id status conclusion <<< "$run"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI run $id passed on $sha."
                echo "found=yes" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI run $id on $sha finished '$conclusion': not deploying. https://github.com/${{ github.repository }}/actions/runs/$id"
              exit 1
            fi
            echo "CI run $id is $status; waiting ($i)."
            sleep 30
          done
          echo "::error::CI on $sha didn't finish in 2 hours: not deploying."
          exit 1
      - name: Full check (typecheck, lint, unit tests, simulator, end-to-end), only without a CI run
        if: steps.ci.outputs.found == 'no'
        run: |
          npx playwright install --with-deps chromium
          npm run check
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEPLOY_KEY=~/.ssh/deploy_key bash deploy/deploy.sh
